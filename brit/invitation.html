<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הזמנה לברית</title>
<style>
@font-face{font-family:'Frank Ruhl Libre';font-weight:400;src:url(fonts/FrankRuhlLibre-400.ttf);}
@font-face{font-family:'Frank Ruhl Libre';font-weight:700;src:url(fonts/FrankRuhlLibre-700.ttf);}
@font-face{font-family:'Frank Ruhl Libre';font-weight:900;src:url(fonts/FrankRuhlLibre-900.ttf);}
@font-face{font-family:'Secular One';src:url(fonts/SecularOne-400.ttf);}
@font-face{font-family:'Suez One';src:url(fonts/SuezOne-400.ttf);}
:root{--navy:#0d2a63;--royal:#1d4fa8;--sky:#8fc3f2;--ice:#e6f2ff;--gold:#e9cf8b;}
@page{size:148mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:'Frank Ruhl Libre',serif;}
.card{width:148mm;height:210mm;position:relative;overflow:hidden;margin:0 auto;color:#fff;
 background:radial-gradient(ellipse 90% 55% at 50% 0%,#2f6fcf 0%,rgba(47,111,207,0) 70%),
            linear-gradient(180deg,#143a82 0%,#0d2a63 60%,#0a2150 100%);}
@media print{body{background:none}}
.stars{position:absolute;inset:0;width:100%;height:100%}
.frame{position:absolute;inset:6mm;border:.35mm solid var(--gold);border-radius:4mm;opacity:.9}
.frame2{position:absolute;inset:8.2mm;border:.2mm solid rgba(233,207,139,.5);border-radius:3mm}
.content{position:absolute;inset:0;padding:15mm 14mm 14mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.bsd{font-size:13pt;color:var(--gold);letter-spacing:.5px;font-weight:700}
.praise{margin-top:6mm;font-size:12pt;line-height:1.55;color:#d6e8fb;font-weight:400;max-width:112mm}
.praise b{color:#fff;font-weight:700}
.hero{margin-top:7mm;font-family:'Suez One',serif;font-size:28pt;line-height:1.12;color:#fff;
 text-shadow:0 .6mm 0 rgba(0,0,0,.25)}
.hero em{font-style:normal;color:var(--sky)}
.divider{margin:5mm 0 4.5mm;width:62mm;height:6mm;flex-shrink:0}
.panel{width:112mm;background:linear-gradient(180deg,rgba(230,242,255,.98),rgba(200,225,252,.98));color:var(--navy);
 border-radius:5mm;padding:5mm 6mm 5mm;box-shadow:0 1.5mm 0 rgba(0,0,0,.18);position:relative}
.panel .label{font-family:'Secular One',sans-serif;font-size:10pt;color:var(--royal);letter-spacing:.3px}
.date{font-family:'Suez One',serif;font-size:23pt;line-height:1.1;margin-top:1.5mm;color:var(--navy)}
.date small{display:block;font-family:'Frank Ruhl Libre',serif;font-size:13pt;font-weight:700;color:var(--royal);margin-top:1mm}
.rule{height:.3mm;background:linear-gradient(90deg,transparent,var(--royal),transparent);margin:3mm 8mm;opacity:.6}
.time{font-family:'Suez One',serif;font-size:21pt;color:var(--navy);margin-top:1mm}
.mincha{font-size:11.5pt;font-weight:700;color:var(--royal);margin-top:.5mm}
.place{font-family:'Suez One',serif;font-size:17pt;color:var(--navy);margin-top:1mm}
.addr{font-size:12pt;font-weight:700;color:var(--royal)}
.footer{margin-top:auto;padding-top:4mm;display:flex;flex-direction:column;align-items:center}
.simcha{font-size:12.5pt;color:#d6e8fb;font-weight:500}
.names{font-family:'Suez One',serif;font-size:24pt;color:var(--gold);margin-top:1.5mm;line-height:1.1}
</style>
</head>
<body>
<div class="card">
 <svg class="stars" viewBox="0 0 148 210" preserveAspectRatio="none" aria-hidden="true">
  <defs>
   <g id="s4"><path d="M0-3 L.7-.7 3 0 .7 .7 0 3 -.7 .7 -3 0 -.7-.7Z"/></g>
   <g id="dot"><circle r=".6"/></g>
  </defs>
  <g fill="#cfe6ff">
   <use href="#s4" transform="translate(20 28) scale(1.1)" opacity=".9"/>
   <use href="#s4" transform="translate(126 22) scale(.8)" opacity=".8"/>
   <use href="#s4" transform="translate(132 60) scale(1.1)" opacity=".9"/>
   <use href="#s4" transform="translate(15 72) scale(.8)" opacity=".7"/>
   <use href="#s4" transform="translate(135 160) scale(.9)" opacity=".5"/>
   <use href="#s4" transform="translate(14 150) scale(1.2)" opacity=".5"/>
   <use href="#dot" transform="translate(44 16)"/><use href="#dot" transform="translate(98 16)"/>
   <use href="#dot" transform="translate(12 48)"/><use href="#dot" transform="translate(138 100)"/>
   
   <use href="#dot" transform="translate(16 120)" opacity=".5"/><use href="#dot" transform="translate(132 128)" opacity=".5"/>
  </g>
  <!-- soft clouds at bottom -->
  <g fill="#1d4fa8" opacity=".35">
   <circle cx="20" cy="212" r="26"/><circle cx="52" cy="216" r="22"/>
   <circle cx="96" cy="214" r="24"/><circle cx="130" cy="210" r="26"/>
  </g>
 </svg>
 <div class="frame"></div><div class="frame2"></div>
 <div class="content">
  <div class="bsd">בס״ד</div>
  <p class="praise">בשבח והודיה לבורא יתברך על כל הטוב אשר גמלנו,<br>ובפרט על <b>הולדת בננו נ״י</b></p>
  <h1 class="hero">הננו שמחים להודיע<br>על היכנסו <em>בבריתו של<br>אברהם אבינו</em> בע״ה</h1>
  <svg class="divider" viewBox="0 0 62 6"><g stroke="#e9cf8b" stroke-width=".35" fill="none"><path d="M0 3H24M38 3H62"/></g>
   <g fill="none" stroke="#e9cf8b" stroke-width=".5"><path d="M31 .2 L33.6 4.7 H28.4Z"/><path d="M31 5.8 L28.4 1.3 H33.6Z"/></g></svg>
  <div class="panel">
   <div class="label">ביום</div>
   <div class="date">ראשון י״ב כסלו</div>
   <div class="rule"></div>
   <div class="label">בשעה</div>
   <div class="time">13:30</div>
   <div class="mincha">( מנחה ב־13:15 )</div>
   <div class="rule"></div>
   <div class="label">באולם</div>
   <div class="place">רינת יוסף</div>
   <div class="addr">רחוב תורה ועבודה 8</div>
  </div>
  <div class="footer">
   <div class="simcha">בשמחות אצלכם</div>
   <div class="names">שלמה ומיכל בנשעיה</div>
  </div>
 </div>
</div>
</body>
</html>
